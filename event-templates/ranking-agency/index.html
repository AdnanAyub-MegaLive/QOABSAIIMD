        <title>Mega Live AGENCY Rankings</title>

    <body>
        <main id="ranking" data-theme="agency" data-track="agency" data-event="ranking-agency">
            <header>
                <button id="back" aria-label="Back">‹</button>
                <nav id="tracks" aria-label="Ranking category"></nav>
                <div id="filters">
                    <nav id="periods" aria-label="Ranking period"></nav>

                    <time id="countdown">—</time>

                <button id="more" hidden>Show more</button>
                <button id="retry" hidden>Try again</button>
            </section>

                <h2 id="rewards-title">Event rewards</h2>
                <section id="reward-details" class="reward-details" aria-live="polite"></section>
                <button id="close-rewards">Close</button>
            </dialog>
